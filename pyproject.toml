[project]
name = "synthetic-bit-sequence-majority-rule"
version = "0.1.0"
description = "Synthetic binary feature construction using the nearest-neighbor majority rule, with metric comparison, CSV/Excel export, and a PyQt6 desktop GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Kudratillo Tuhtabayev", email = "ktuhtabayev@gmail.com" }
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "PyQt6>=6.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.5",
  "mypy>=1.8",
  "ipykernel>=6.29"
]

[project.scripts]
synthetic-bit-sequence = "synthetic_bit_sequence_majority_rule.cli:main"

[project.gui-scripts]
synthetic-bit-sequence-gui = "synthetic_bit_sequence_majority_rule.gui.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
