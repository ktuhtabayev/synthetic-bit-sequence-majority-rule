    - chebyshev
    - canberra

  future_extensions:
    - "All experiments follow the new dynamic k rule only."
    - "full = 1..k_max where k_max = min(m-1, 2*min_i|K_i| - 3)."
    - "reduced = odd values from 3 to k_max."